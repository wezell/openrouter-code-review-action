name: Auto Release on Merge

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Cut next release (feat -> minor, otherwise patch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -z "$latest" ]; then
            echo "No existing version tags; skipping auto-release."
            exit 0
          fi
          has_feat=$(git log "$latest"..HEAD --pretty=%s | grep -cE '^feat(\([^)]*\))?:' || true)
          major=$(echo "$latest" | sed -E 's/^v([0-9]+).*/\1/')
          minor=$(echo "$latest" | sed -E 's/^v[0-9]+\.([0-9]+).*/\1/')
          patch=$(echo "$latest" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+).*/\1/')
          if [ "$has_feat" -gt 0 ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi
          next="v${major}.${minor}.${patch}"
          echo "Cutting ${next} (prior ${latest}, feat=${has_feat})"
          git tag -a "$next" -m "dotbot code review ${next}"
          git push origin "$next"
          gh release create "$next" \
            --title "dotbot code review ${next}" \
            --latest \
            --notes "Auto-generated release from merge to main."
          # Point the moving v1/latest tags at this release's commit so @v1
          # consumers always get the newest merged code, independent of the
          # separate release-published retag workflow.
          sha=$(git rev-parse HEAD)
          for t in v1 latest; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${t}" >/dev/null 2>&1 || true
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${t}" -f "sha=${sha}" >/dev/null
            echo "Retagged ${t} -> ${sha}"
          done
name: dotbot code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: dotbot-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: dotbot autonomous review
        uses: wezell/openrouter-code-review-action@70ba727c30a55b9d78fe65ccc9d131e139dea295
        with:
          mode: review
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: deepseek/deepseek-v4-pro-0813
          reasoning_effort: high
          web_search_mode: live
          debug_level: 1
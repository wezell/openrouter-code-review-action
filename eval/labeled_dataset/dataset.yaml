  # PR 35567 — bug_fix · 3-line transactional fix
  # Slot: real_bug_present, multiline_suggestion
  # ------------------------------------------------------------------------
  - id: gt-35567-001
    pr_id: dotcms-core-35567
    head_sha: 922996001a7e092e2a591db45b74d7603d085117
    label: TP
    severity: P1
    class: bug_correctness
    path_hint: "dotCMS/src/main/java/com/dotcms/uniquefields/UniqueFieldValidationStrategy.java"
    line_range: null
    line_range_status: unverified
    title: "P1: @CloseDBIfOpened on UniqueFieldValidator broke atomicity with parent contentlet save"
    rationale: >-
      The pre-fix code carried @CloseDBIfOpened on the validator, which
      committed/closed the surrounding DB transaction mid-save. Removing
      the annotation restores atomicity with the contentlet save the
      validator runs inside. A reviewer should affirm this is the
      intended fix (catching that absence-of-annotation == correctness
      improvement is the test of the diff).
    match_keywords:
      - "@CloseDBIfOpened"
      - "atomicity"
      - "transaction"
      - "contentlet save"
    source: merged_pr_metadata
    confidence: high

  - id: gt-35567-002
    pr_id: dotcms-core-35567
    head_sha: 922996001a7e092e2a591db45b74d7603d085117
    label: FP
    severity: P2
    class: missing_test
    path_hint: null
    line_range: null
    line_range_status: unverified
    title: "P2: removal of @CloseDBIfOpened lacks a regression test"
    rationale: >-
      A 3-line annotation removal that *restores* atomicity does not
      need a brand-new unit test to prove a long-standing transactional
      contract is now respected. The fix is the simplest defensible one
      for the bug. Demanding a new test on a 3-line correctness
      restoration is a canonical refactor-regression-style FP trap.
    match_keywords:
      - "missing test"
      - "no test"
      - "regression test"
    source: bake_off_diagnostic
    confidence: medium


# =============================================================================
# Ground-truth labeled dataset of historical PR review findings.
# Sub-AC 2.3.1 deliverable.
# =============================================================================
#
# Purpose
# -------
#   This file is the **benchmark dataset** for the Codex → OpenRouter parity
#   bake-off. Each entry is a candidate review finding, anchored to a PR in
#   `eval/sample-prs.yaml`, with a retrospective ground-truth label of
#   `TP` (true positive — concrete actionable bug present in the diff) or
#   `FP` (false positive — non-actionable, phantom, pre-existing, or out of
#   scope per `eval/baseline-methodology.md` §3).
#
#   At scoring time, model output is matched against entries here using the
#   §4.5 matching rules (same path, line-range overlap or ±3 lines, same
#   underlying bug per reviewer judgement). A model finding that matches a
#   `TP` entry contributes to finding-overlap; a model finding that matches
#   an `FP` entry counts toward the false-positive rate.
#
# What this dataset is NOT
# ------------------------
#   * It is not the model output. Model output lives in
#     `eval/runs/<pr_id>/codex.json` and `evaluation/bakeoff/runs/pr-<n>/openrouter.json`.
#   * It is not a per-finding label of model output — that is the
#     `labels[]` block inside each run artifact (methodology §2.2 schema).
#     Those labels are produced by labelers reading model output.
#     This dataset is the upstream **ground truth** those labelers cross-check
#     against, so a finding's TP/FP classification is grounded in the diff,
#     not in whichever model emitted it (methodology §2.3 rule 5: no model
#     self-grading).
#   * It is not exhaustive. Every entry can be expanded with concrete line
#     ranges and additional candidates as labelers inspect each PR's diff.
#     Entries with `line_range_status: unverified` are anchors that still
#     need a labeler to fix the line numbers from the actual diff at
#     `head_sha`. Entries with `line_range_status: confirmed` have been
#     pinned by inspection.
#
# Schema
# ------
#   Each entry under `findings:` MUST have:
#     id              : stable benchmark identifier (e.g. gt-35567-001)
#     pr_id           : matches `eval/sample-prs.yaml` `prs[].id`
#     head_sha        : matches `eval/sample-prs.yaml` `prs[].head_sha`
#     label           : TP | FP
#     severity        : P0 | P1 | P2 | P3 (per `prompts/review.md`)
#     class           : finding class (bug_correctness, security, performance,
#                       refactor_regression, style_nit, missing_test,
#                       hallucination, ...)
#     path_hint       : best-effort target file path (full path from repo root)
#     line_range      : { start: int, end: int } | null
#     line_range_status: confirmed | unverified
#     title           : short title — matches the prompt's "## P{N}: ..." format
#     rationale       : ≤ 2 sentences — *why* this is the label (not what the
#                       model said; what the diff actually shows).
#     match_keywords  : list of distinctive substrings the matcher uses to
#                       associate noisy model output with this entry; helps
#                       the §4.5 reviewer-judgement step go faster.
#     source          : retrospective_diff_review | merged_pr_metadata |
#                       reviewer_comment_thread | bake_off_diagnostic
#     confidence      : high | medium | low (labeler's confidence in the label)
#
# Methodology binding
# -------------------
#   * Label set, definitions, and tie-break rules: `eval/baseline-methodology.md` §2-§3.
#   * Severity definitions: `prompts/review.md`.
#   * Sample PR registry the entries reference: `eval/sample-prs.yaml`.
#   * Matching rules used at score time: `eval/baseline-methodology.md` §4.5.
#
# Adding new entries
# ------------------
#   1. Pick a sample PR and inspect its diff at `head_sha`.
#   2. Either populate a real bug found in the diff (`label: TP`) or a
#      common spurious complaint a model is likely to make on this diff
#      (`label: FP`). Both kinds belong here — the dataset benchmarks
#      both finding-overlap and FP-discipline (seed AC 1 + AC 2).
#   3. Set `line_range_status: confirmed` once the line numbers are pinned
#      from the actual diff. Until then, leave it `unverified` and provide
#      `path_hint` + `match_keywords` so the matcher still has anchors.
#   4. Run `pytest tests/test_labeled_dataset.py` — schema and cross-ref
#      checks fail loudly if anything is broken.
#

version: "1.0"
dataset_id: "dotcms-bakeoff-v1"
generated_at: "2026-05-06"
source_sample: "eval/sample-prs.yaml"
methodology: "eval/baseline-methodology.md"

label_taxonomy:
  TP: >-
    True positive. A concrete, actionable issue present in the diff at
    head_sha. A competent reviewer would flag it; the author would fix it
    if shown. Per methodology §2.1.
  FP: >-
    False positive. A non-actionable, phantom, pre-existing, speculative,
    out-of-scope, schema-invalid, or hallucinated finding. Per
    methodology §3 — first matching rule wins.

severity_taxonomy:
  P0: "must-fix-before-merge — data loss, security breach, build break"
  P1: "should-fix — correctness or significant regression risk"
  P2: "nice-to-fix — code quality with some concrete consequence"
  P3: "nit — style/clarity; tracked separately in scoring (§4.4)"

class_taxonomy:
  bug_correctness:        "Logic / state-handling / atomicity / null handling bug"
  security:               "AuthN/AuthZ, input validation against attacker, info disclosure"
  performance:            "Algorithmic regression, unbounded loop, N+1, missing index"
  refactor_regression:    "Behavior change snuck into a 'pure refactor' diff"
  missing_test:           "Behavior change with no test coverage of the new path"
  hallucination:          "Cites a file/function/API that doesn't exist at head_sha"
  pre_existing:           "Flagged code wasn't introduced or modified by this diff"
  style_nit:              "Formatting/personal-preference; explicitly excluded by prompt"
  speculation:            "'May break X' without naming the concrete code that breaks"
  out_of_scope:           "Doc typo, change outside the diff, intentional change"


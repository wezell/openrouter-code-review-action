    title: "P0: short-term permission cache must be invalidated on role revocation"
    rationale: >-
      The pre-fix bug: a revoked role still resolved to its old
      permissions until the short-term cache TTL elapsed, leaving a
      window where a removed user kept access. The diff adds the
      explicit invalidation path. A reviewer should confirm every
      revocation entry-point routes through the new invalidation
      (factory + cache + integration test must agree).
    match_keywords:

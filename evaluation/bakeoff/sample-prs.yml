# Curated PR sample for the Codex-vs-OpenRouter parity bake-off.
#
# Sub-AC 1.1.1 deliverable: 5–10 representative historical PRs from the
# primary consumer repo (dotCMS/core) covering varied change types so the
# parity comparison is not skewed by a single style of change.
#
# This file is the machine-readable index. See sample-prs.md for the
# selection rationale and the per-PR notes.
#
# Schema (one entry per PR):
#   number:         GitHub PR number (int)
#   repo:           "owner/repo" (string)
#   title:          PR title (string)
#   author:         GitHub login (string)
#   merged_at:      ISO-8601 UTC merge timestamp (string)
#   merge_commit:   merge-commit SHA (string) — review against this SHA
#   base_ref:       PR base branch (string) — usually "main"
#   head_ref:       PR head branch (string)
#   additions:      lines added (int)
#   deletions:      lines deleted (int)
#   changed_files:  number of files changed (int)
#   surface:        primary surface area — backend | frontend | infra | mixed
#   change_type:    bug_fix | feature | refactor | security | performance | infra
#   security_signal: true if the change has explicit security/auth/permissions
#                    impact (allows the bake-off to weight FP discipline on
#                    sensitive paths)
#   why:            one-line selection rationale

repo: dotCMS/core
total: 10
target_size: 5-10  # per Sub-AC 1.1
sampling_window: 2026-04-23 to 2026-05-06  # last ~2 weeks of merged PRs at task time
sampling_method: hand-picked from `gh pr list --repo dotCMS/core --state merged`
                 to span change_type, surface area, and security signal while
                 keeping each PR small enough to fit a single review pass


[mypy]
python_version = 3.12
pretty = True
explicit_package_bases = True
namespace_packages = True

[mypy-github]
ignore_missing_imports = True
[mypy-github.*]
ignore_missing_imports = True

[mypy-codex]
ignore_missing_imports = True
[mypy-codex.*]
ignore_missing_imports = True

[mypy-pytest]
ignore_missing_imports = True
[mypy-pytest.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True
[mypy-yaml.*]
ignore_missing_imports = True

# Test files use loose mock/duck-typing patterns that conflict with strict mypy.
# Runtime correctness is enforced by pytest (851 passing); we don't gate on test type-strictness.
[mypy-tests.test_compare_findings]
ignore_errors = True
[mypy-tests.test_review_schema]
ignore_errors = True
[mypy-tests.test_act_runner]
ignore_errors = True
[mypy-tests.test_review_state_multirun]
ignore_errors = True
[mypy-tests.test_review_workflow_sha_delta_scope]
ignore_errors = True
[mypy-tests.test_act_mode_e2e]
ignore_errors = True

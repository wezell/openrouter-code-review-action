  - path: cli/clients/codex_client.py
    role: primary
    summary: Codex SDK wrapper to be replaced by an OpenRouter chat-completions client with tool-use for schema
  - path: cli/core/config.py
    role: primary
    summary: Config dataclass; add config-file loader, swap OPENAI_API_KEY for OPENROUTER_API_KEY
  - path: cli/review/

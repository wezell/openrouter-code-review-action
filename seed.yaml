  - path: action.yml
    role: primary
    summary: Composite action — redo inputs (drop openai_api_key, add openrouter_api_key + config_path)
  - path: prompts/review.md
    role: reference
    summary: Built-in reviewer prompt — reuse
  - path: pyproject.toml
    role: reference
    summary: Drop codex-python; add openrouter HTTP client + aider-chat

existing_patterns:
  - Composite GitHub Action with Python entrypoints under cli/
  - Pydantic + dataclasses for typed config (ReviewConfig)
  - Two-turn structured output (agent turn + schema-enforced output turn)
  - Review-continuation cache keyed by (repo, PR, model, reviewed_SHA) with fallback on cache miss or non-ancestor SHA
  - Streaming agent-message events to logs
  - author_association allowlist for act-mode trigger trust

existing_dependencies:
  keep:
    - PyGithub==2.8.1
    - pydantic==2.12.5
    - uv (build/deps)
    - ruff, mypy, pytest (dev)
  remove:
    - codex-python==1.122.0
  add:
    - openai SDK pointed at OpenRouter base URL (or httpx client)
    - aider-chat (act-mode backend)

